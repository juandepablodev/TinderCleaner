name: CI & Build Pipeline

on:
  push:
    branches: [ main, dev, master ]
  pull_request:
    branches: [ main, dev, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-package:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: |
          XCODE_PATH=$(ls -d /Applications/Xcode_16*.app /Applications/Xcode_15*.app /Applications/Xcode.app 2>/dev/null | head -n 1)
          if [ -n "$XCODE_PATH" ]; then
            echo "Selecting Xcode at $XCODE_PATH"
            sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
          fi
          xcodebuild -version

      - name: Run Network Guardrail Lint
        run: |
          chmod +x ./codigo/scripts/lint_network.sh
          ./codigo/scripts/lint_network.sh

      - name: Build and Test (iOS Simulator)
        run: |
          xcodebuild test \
            -project codigo/TinderCleaner.xcodeproj \
            -scheme TinderCleaner \
            -destination 'platform=iOS Simulator,name=iPhone 15' \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload Test Results Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-xcresult
          path: TestResults.xcresult
          retention-days: 14

      - name: Package Unsigned IPA
        if: success()
        run: |
          mkdir -p Payload
          xcodebuild build \
            -project codigo/TinderCleaner.xcodeproj \
            -scheme TinderCleaner \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build/DerivedData \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO
          
          cp -r build/DerivedData/Build/Products/Release-iphoneos/TinderCleaner.app Payload/
          zip -r TinderCleaner-unsigned.ipa Payload

      - name: Upload IPA Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: TinderCleaner-unsigned-ipa
          path: TinderCleaner-unsigned.ipa
          retention-days: 30
